{{define "title"}}{{.Title}} · {{.Brand}}{{end}}
{{define "content"}}
{{with .Link}}
<div class="max-w-3xl">
  <a href="/" class="text-sm text-slate-400 hover:text-amber-300">← Kısalt</a>
  <p class="mt-4 text-xs uppercase tracking-widest text-amber-300">Bağlantı istatistiği</p>
  <h1 class="mt-1 font-mono text-3xl sm:text-4xl font-bold break-all"><a href="{{.ShortURL}}" class="hover:text-amber-300">{{.ShortURL}}</a></h1>
  <p class="mt-3 text-slate-400 break-all">Hedef: <a href="{{.URL}}" rel="noopener noreferrer" class="text-slate-200 underline decoration-dotted">{{.URL}}</a></p>

  <dl class="mt-8 grid gap-3 sm:grid-cols-3">
    <div class="rounded-xl bg-ink-900 border border-ink-700 p-5">
      <dt class="text-xs uppercase tracking-wide text-slate-500">Tıklama</dt>
      <dd class="mt-1 text-4xl font-bold text-amber-400">{{.Clicks}}</dd>
    </div>
    <div class="rounded-xl bg-ink-900 border border-ink-700 p-5">
      <dt class="text-xs uppercase tracking-wide text-slate-500">Oluşturuldu</dt>
      <dd class="mt-1 text-lg font-semibold">{{date .CreatedAt}}</dd>
    </div>
    <div class="rounded-xl bg-ink-900 border border-ink-700 p-5">
      <dt class="text-xs uppercase tracking-wide text-slate-500">Son tıklama</dt>
      <dd class="mt-1 text-lg font-semibold">{{datep .LastClickAt}}</dd>
    </div>
  </dl>

  <div class="mt-8 rounded-xl bg-ink-900 border border-ink-700 p-4 text-xs">
    <p class="font-semibold text-slate-300 mb-2">JSON</p>
    <pre class="overflow-x-auto rounded-md bg-ink-950 p-3 font-mono text-[11px] text-slate-300">GET {{$.BaseURL}}/api/links/{{.Code}}</pre>
  </div>
</div>
{{end}}
{{end}}
