<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="(${mode} == 'create' ? 'Yeni kitap' : 'Kitabı düzenle') + ' · Kütüphane Plus'">Kitap · Kütüphane Plus</title></head>
<body>
<main class="container py-4 flex-grow-1">
  <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/admin/books}">Kitaplar</a></li><li class="breadcrumb-item active" th:text="${mode} == 'create' ? 'Yeni kitap' : 'Düzenle'">Yeni</li></ol></nav>
  <div class="card p-4" style="max-width: 720px">
    <h1 class="h3 mb-3" th:text="${mode} == 'create' ? 'Yeni kitap ekle' : 'Kitabı düzenle'">Kitap</h1>
    <form th:object="${book}" th:action="${mode} == 'create' ? @{/admin/books} : @{/admin/books/{id}(id=${book.id})}" method="post" novalidate>
      <div class="alert alert-danger py-2" th:if="${#fields.hasGlobalErrors()}"><p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="title">Başlık</label>
          <input class="form-control" id="title" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="author">Yazar</label>
          <input class="form-control" id="author" th:field="*{author}" th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{author}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="isbn">ISBN</label>
          <input class="form-control" id="isbn" th:field="*{isbn}" th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'" placeholder="978-…">
          <div class="invalid-feedback" th:errors="*{isbn}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="genre">Tür</label>
          <input class="form-control" id="genre" th:field="*{genre}" list="genres">
          <datalist id="genres"><option>Roman</option><option>Yazılım</option><option>Tarih</option><option>Çocuk</option><option>Şiir</option></datalist>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="publishedYear">Yayın yılı</label>
          <input class="form-control" type="number" id="publishedYear" th:field="*{publishedYear}" th:classappend="${#fields.hasErrors('publishedYear')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{publishedYear}"></div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="copiesTotal">Toplam kopya</label>
          <input class="form-control" type="number" min="1" id="copiesTotal" th:field="*{copiesTotal}" th:classappend="${#fields.hasErrors('copiesTotal')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{copiesTotal}"></div>
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit" th:text="${mode} == 'create' ? 'Kaydet' : 'Güncelle'">Kaydet</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/books}">Vazgeç</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
