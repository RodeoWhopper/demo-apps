<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Katalog · Kütüphane Plus</title></head>
<body>
<main class="container py-4 flex-grow-1">
  <section class="hero p-4 p-md-5 mb-4">
    <div class="row align-items-center g-4">
      <div class="col-lg-7">
        <h1 class="display-6 mb-2">Mahalle kütüphanesi, dijital raflarla.</h1>
        <p class="mb-0 opacity-75">Kataloğu arayın, üye girişiyle 14 günlüğüne ödünç alın, kütüphaneci hesabıyla envanteri yönetin.</p>
      </div>
      <div class="col-lg-5">
        <form th:action="@{/}" method="get" class="d-flex gap-2">
          <input class="form-control form-control-lg" type="search" name="q" th:value="${q}" placeholder="Başlık, yazar veya ISBN…" aria-label="Ara">
          <button class="btn btn-warning btn-lg" type="submit">Ara</button>
        </form>
      </div>
    </div>
  </section>

  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="stat card p-3"><div class="value" th:text="${totalBooks}">10</div><div class="text-muted small">katalogdaki kitap</div></div></div>
    <div class="col-md-4"><div class="stat card p-3"><div class="value" th:text="${activeLoans}">2</div><div class="text-muted small">aktif ödünç</div></div></div>
    <div class="col-md-4"><div class="stat card p-3"><div class="value text-danger" th:text="${overdueLoans}">1</div><div class="text-muted small">gecikmiş iade</div></div></div>
  </div>

  <div class="d-flex justify-content-between align-items-baseline mb-2">
    <h2 class="h4 mb-0" th:text="${#strings.isEmpty(q)} ? 'Tüm kitaplar' : 'Arama: &quot;' + ${q} + '&quot;'">Tüm kitaplar</h2>
    <span class="text-muted small" th:text="${#lists.size(books)} + ' sonuç'">10 sonuç</span>
  </div>

  <div class="row g-3" th:if="${!#lists.isEmpty(books)}">
    <div class="col-md-6 col-lg-4" th:each="book : ${books}">
      <div class="card book-card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <h3 class="card-title h5 mb-1"><a class="text-decoration-none" th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Kitap</a></h3>
            <span class="badge rounded-pill" th:classappend="${book.available} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${book.copiesAvailable} + ' / ' + ${book.copiesTotal}">1/2</span>
          </div>
          <p class="text-muted mb-2" th:text="${book.author}">Yazar</p>
          <p class="small mb-3">
            <span class="badge bg-light text-dark border" th:text="${book.genre}">Roman</span>
            <span class="text-muted ms-1" th:text="${book.publishedYear}">1972</span>
          </p>
          <a class="btn btn-outline-primary btn-sm mt-auto align-self-start" th:href="@{/books/{id}(id=${book.id})}">Detay & ödünç al</a>
        </div>
      </div>
    </div>
  </div>
  <div class="card p-5 text-center text-muted" th:if="${#lists.isEmpty(books)}">Aramanızla eşleşen kitap yok.</div>
</main>
</body>
</html>
