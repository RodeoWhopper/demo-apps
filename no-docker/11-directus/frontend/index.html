<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kılavuz Etkinlik · Şehir şehir etkinlik rehberi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand"><span class="brand__mark">K</span>Kılavuz Etkinlik</div>
      <nav class="topbar__links"><a href="http://localhost:8011/admin" id="admin-link">Yönetim</a></nav>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <h1>Bu ay nerede, ne var?</h1>
      <p>Konser, atölye, sergi ve buluşmalar. İçerik Directus üzerinden yönetilir; bu sayfa yalnızca yayımlanmış etkinlikleri gösterir.</p>
    </section>
    <section class="filters" aria-label="Filtreler">
      <label>Şehir <select id="city"><option value="">Tüm şehirler</option></select></label>
      <label>Kategori <select id="category"><option value="">Tüm kategoriler</option></select></label>
      <label>Ara <input id="q" type="search" placeholder="başlık, mekân…"></label>
      <span class="filters__count" id="count"></span>
    </section>
    <section class="grid" id="grid"><p class="status">Etkinlikler yükleniyor…</p></section>
  </main>
  <footer class="footer">Kılavuz Etkinlik — Directus 11 headless CMS + saf HTML/JS.</footer>
  <script src="config.js"></script>
  <script>document.getElementById("admin-link").href = (window.API_URL || "") + "/admin";</script>
  <script src="app.js"></script>
</body>
</html>
