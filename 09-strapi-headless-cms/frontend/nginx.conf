server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # config.js is edited per deployment – never cache it aggressively
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }
}
