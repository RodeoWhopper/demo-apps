# Serves the Astro/Starlight build output (dist/) on port 4314.
# Pages are directories with index.html (Astro `build.format: 'directory'`), so
# /getting-started/ resolves via $uri/. Unknown paths return Starlight's 404.html.
server {
    listen 4314;
    listen [::]:4314;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed assets are immutable
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    # Pagefind search index (fetched at runtime by the search UI)
    location /pagefind/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
