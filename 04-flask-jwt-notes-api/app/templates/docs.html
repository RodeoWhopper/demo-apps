<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scribble API · Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    :root { --ink: #1d2b53; --paper: #fffdf6; --marker: #ffd23f; --marker-deep: #f5b800; --pen: #ff4c6a; }
    body { margin: 0; background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scribble-bar { background: var(--ink); color: #fff; padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; border-bottom: 6px solid var(--marker); }
    .scribble-logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
    .scribble-logo span { display: inline-block; width: 1.6rem; height: 1.6rem; background: var(--marker); border-radius: 0.4rem 0.4rem 0.4rem 0.1rem; transform: rotate(-8deg); }
    .scribble-bar code { background: rgba(255,255,255,0.12); padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.85rem; }
    .scribble-meta { font-size: 0.9rem; opacity: 0.9; display: flex; gap: 1rem; flex-wrap: wrap; margin-left: auto; }
    .scribble-hint { background: var(--marker); color: var(--ink); padding: 0.6rem 1.5rem; font-size: 0.9rem; }
    .scribble-hint strong { color: var(--pen); }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { color: var(--ink); }
    .swagger-ui .scheme-container { background: transparent; box-shadow: none; }
    .swagger-ui .btn.authorize { border-color: var(--ink); color: var(--ink); }
    .swagger-ui .btn.authorize svg { fill: var(--ink); }
    #swagger-ui { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="scribble-bar">
    <div class="scribble-logo"><span></span> Scribble API</div>
    <code>v{{ version }}</code>
    <nav class="scribble-meta">
      <a style="color:#fff" href="/openapi.yaml">openapi.yaml</a>
      <a style="color:#fff" href="/healthz">/healthz</a>
    </nav>
  </header>
  <div class="scribble-hint">
    Try it: <strong>POST /auth/login</strong> with <code>demo@scribble.dev / Demo123!</code>, copy the <code>access_token</code>, click <strong>Authorize</strong>, then call <strong>GET /notes</strong>.
    Admin endpoints need <code>admin@scribble.dev / Admin123!</code>.
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.addEventListener("load", function () {
      window.ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true,
        tryItOutEnabled: true,
        displayRequestDuration: true,
        presets: [SwaggerUIBundle.presets.apis],
      });
    });
  </script>
</body>
</html>
