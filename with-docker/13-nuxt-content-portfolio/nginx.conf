# Serves the static output of `nuxt generate` (.output/public) on port 3013.
# No SPA fallback: every route is a real pre-rendered HTML file; unknown paths get the
# pre-rendered 404.html.
server {
    listen 3013;
    listen [::]:3013;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed build assets are immutable
    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    # Content DB dumps + payloads used for client-side navigation
    location /__nuxt_content/ {
        expires 1h;
        try_files $uri =404;
    }

    location = /rss.xml {
        types { application/rss+xml xml; }
        expires 1h;
    }

    location / {
        expires -1;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
