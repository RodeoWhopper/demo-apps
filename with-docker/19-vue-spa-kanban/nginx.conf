# Flowboard SPA — nginx config for Vue Router HTML5 history mode (port 8019).
# The key line is `try_files $uri $uri/ /index.html;` — any path that is not a real file
# (e.g. /board/c-3 or /admin) must return index.html with status 200 so the client-side
# router can take over. Without it, deep links and page refreshes return 404.
server {
    listen 8019;
    listen [::]:8019;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
