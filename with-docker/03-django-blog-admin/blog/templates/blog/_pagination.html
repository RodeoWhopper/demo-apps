{% if is_paginated %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}">&larr; Newer</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}">Older &rarr;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
