# Nordwind static site — nginx config (listens on 8081)
server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Security headers (inherited by every location below because none of them
    # declares its own add_header — `expires` does not break inheritance)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cache policy: long for static assets, short for xml/txt, no-cache for HTML
    location ~* \.(css|js|svg|webmanifest|ico)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~* \.(xml|txt)$ {
        expires 1d;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
