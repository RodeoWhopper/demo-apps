# Serves the built SPA with history-API fallback and proxies /api/* to the FastAPI container.
server {
    listen 5015;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Plain-text health endpoint for orchestrators (the SPA itself is served at /).
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"orbit-web"}';
    }

    # Strip the /api prefix and forward to the API service defined in docker-compose.yml.
    location /api/ {
        proxy_pass http://api:8015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
