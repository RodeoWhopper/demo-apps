<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      th:fragment="page(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Kütüphane Plus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-kp navbar-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Kütüphane<span>Plus</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-label="Menü">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Katalog</a></li>
        <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/my/loans}">Ödünçlerim</a></li>
        <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Yönetim</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/admin/books}">Kitaplar</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/loans}">Tüm ödünçler</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/members}">Üyeler</a></li>
          </ul>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" sec:authorize="isAuthenticated()">
          <span sec:authentication="principal.fullName">Kullanıcı</span>
          <span class="badge badge-gold ms-1" sec:authorize="hasRole('ADMIN')">Kütüphaneci</span>
          <span class="badge bg-secondary ms-1" sec:authorize="hasRole('MEMBER')">Üye</span>
        </span>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="m-0">
          <button class="btn btn-sm btn-outline-light" type="submit">Çıkış</button>
        </form>
        <a class="btn btn-sm btn-warning" th:href="@{/login}" sec:authorize="!isAuthenticated()">Giriş yap</a>
      </div>
    </div>
  </div>
</nav>

<div class="container mt-3">
  <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Kapat"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Kapat"></button>
  </div>
</div>

<main class="container py-4 flex-grow-1" th:replace="${content}">Sayfa içeriği</main>

<footer class="border-top py-3 mt-auto">
  <div class="container d-flex flex-wrap justify-content-between">
    <span>© 2026 Kütüphane Plus · Spring Boot 3 + Spring Security + Thymeleaf demo</span>
    <span>Sağlık: <code>/actuator/health</code></span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
